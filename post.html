<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章</title>
    <link rel="stylesheet" href="style.css">
    <!-- KaTeX: 数学公式渲染 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"></script>
    <!-- marked.js: Markdown 渲染 -->
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
</head>
<body>
    <div id="content">
        <a class="back" href="index.html">← 返回主页</a>
        <div id="article">加载中...</div>
        <footer><p>© 2026 m0re1s · Powered by GitHub Pages</p></footer>
    </div>

    <!-- KaTeX 脚本带 defer，内联渲染脚本必须同样 defer：保证执行时 renderMathInElement 已就绪（否则本地预览公式不渲染） -->
    <script defer>
        // 短码：文件名的 djb2 哈希（模 36^6）的 6 位 base36。
        // ⚠️ 算法须与 404.html 中 shortCode 保持一致，改动需同步两处。
        function shortCode(str) {
            let h = 5381;
            for (let i = 0; i < str.length; i++) h = (h * 33 + str.charCodeAt(i)) >>> 0;
            return (h % 2176782336).toString(36).padStart(6, '0');
        }

        // GeoGebra 自托管交互图：扫描 <div class="ggb-applet" data-ggb="assets/xxx.ggb">，
        // 命中才动态加载本地 deployggb.js（官方 Math Apps Bundle，assets/geogebra/）并逐个注入；
        // 无此类 div 的文章零额外加载。⚠️ 文章 md 里写 <script> 不会执行（innerHTML 注入），交互图必须走此约定，
        // 写法见 local_docs/AUTHORING.md。
        function initGgbApplets(root) {
            const divs = root.querySelectorAll('.ggb-applet[data-ggb]');
            if (!divs.length) return;
            const fallback = div => {
                div.innerHTML = 'GeoGebra 交互图加载失败。<a href="' + div.dataset.ggb + '">下载 .ggb 文件</a>（可用本地 GeoGebra 打开）';
            };
            const s = document.createElement('script');
            s.src = 'assets/geogebra/deployggb.js';
            s.onerror = () => divs.forEach(fallback);
            s.onload = () => {
                // ⚠️ deployggb.js 的 codebase 是全页共享状态，同页所有交互图必须用同一变体：
                // 取第一个 div 的 data-variant 决定（"simple" = 轻量纯 2D 版 webSimple，默认完整版 web3d 支持 3D）
                const variant = divs[0].dataset.variant === 'simple' ? 'webSimple' : 'web3d';
                divs.forEach(div => {
                    try {
                        const applet = new GGBApplet({
                            appName: div.dataset.app || 'classic',
                            filename: div.dataset.ggb,
                            width: parseInt(div.dataset.width || '800', 10),
                            height: parseInt(div.dataset.height || '600', 10),
                            showToolBar: div.dataset.toolbar === 'true',
                            showAlgebraInput: div.dataset.algebra === 'true',
                            showMenuBar: false,
                            showResetIcon: false
                        }, '5.0');
                        applet.setHTML5Codebase('assets/geogebra/HTML5/5.0/' + variant + '/');
                        applet.inject(div);
                    } catch (e) {
                        fallback(div);
                    }
                });
            };
            document.head.appendChild(s);
        }

        // 从 URL 获取要加载的 markdown 文件名
        const params = new URLSearchParams(window.location.search);
        const file = params.get('file');
        if (!file) {
            document.getElementById('article').innerHTML = '<p>未指定文件。</p>';
        } else {
            // 读取 markdown 文件并渲染
            fetch('posts/' + file)
                .then(r => r.text())
                .then(text => {
                    document.getElementById('article').innerHTML = marked.parse(text);
                    // 渲染数学公式
                    if (typeof renderMathInElement !== 'undefined') {
                        renderMathInElement(document.getElementById('article'), {
                            delimiters: [
                                {left: '$$', right: '$$', display: true},
                                {left: '$', right: '$', display: false}
                            ]
                        });
                    }
                    // 嵌入的 GeoGebra 交互图（若有）
                    initGgbApplets(document.getElementById('article'));
                    // 更新页面标题
                    const h1 = document.querySelector('#article h1');
                    if (h1) document.title = h1.textContent;
                    // 标题下日期/标签行：从 index.html 的 posts-data 清单读取（全站唯一数据源），读取失败静默跳过
                    fetch('index.html').then(r => r.text()).then(html => {
                        const m = html.match(/<script id="posts-data"[^>]*>([\s\S]*?)<\/script>/);
                        if (!m) return;
                        const post = JSON.parse(m[1]).find(p => p.file === file);
                        if (!post || !h1) return;
                        const meta = document.createElement('p');
                        meta.className = 'post-meta';
                        const time = document.createElement('time');
                        time.dateTime = post.date;
                        time.textContent = post.date;
                        meta.appendChild(time);
                        post.tags.forEach(t => {
                            meta.appendChild(document.createTextNode(' '));
                            const s = document.createElement('span');
                            s.className = 'mini-tag';
                            s.textContent = t;
                            meta.appendChild(s);
                        });
                        h1.after(meta);
                    }).catch(() => {});
                    // 文章末尾显示短链（算法须与 404.html 一致），供复制分享
                    const shortUrl = location.origin + location.pathname.replace(/post\.html.*$/, '') + shortCode(file);
                    const sl = document.createElement('p');
                    sl.className = 'shortlink';
                    sl.innerHTML = '本文短链：<code></code> <button type="button">复制</button>';
                    sl.querySelector('code').textContent = shortUrl;
                    sl.querySelector('button').addEventListener('click', () => {
                        const btn = sl.querySelector('button');
                        navigator.clipboard.writeText(shortUrl).then(() => {
                            btn.textContent = '已复制';
                            setTimeout(() => { btn.textContent = '复制'; }, 1500);
                        }).catch(() => { btn.textContent = '复制失败'; });
                    });
                    document.getElementById('article').appendChild(sl);
                })
                .catch(() => {
                    document.getElementById('article').innerHTML = '<p>文件加载失败。</p>';
                });
        }
    </script>
</body>
</html>
